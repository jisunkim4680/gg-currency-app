<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3568BD"/>
      <stop offset="100%" stop-color="#2B5AA6"/>
    </linearGradient>
    <!-- 실버 그라데이션 (왼쪽 면) -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="40%" stop-color="#c0c0c0"/>
      <stop offset="70%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <!-- 틸 그라데이션 (하단 면) -->
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72e8d0"/>
      <stop offset="100%" stop-color="#4dcfb8"/>
    </linearGradient>
    <!-- 다크틸 (오른쪽 면) -->
    <linearGradient id="darkTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a9e9e"/>
      <stop offset="100%" stop-color="#2d7a7a"/>
    </linearGradient>
    <!-- 옐로우 (상단 V) -->
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d44d"/>
      <stop offset="100%" stop-color="#c8b830"/>
    </linearGradient>
    <!-- 핀 그라데이션 -->
    <linearGradient id="pinColor" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF5555"/>
      <stop offset="100%" stop-color="#E03030"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>

  <!-- 경기지역화폐 로고 (중앙, 크게) -->
  <g transform="translate(180, 200) scale(1.35)">
    <!-- 왼쪽 실버 면 (G의 왼쪽) -->
    <path d="M120 350 L120 180 Q120 140 160 140 L200 140 L200 180 L170 180 Q155 180 155 195 L155 320 Q155 340 175 340 L220 340 L220 260 L180 260 L180 220 L260 220 L260 370 Q260 390 240 390 L160 390 Q120 390 120 350 Z" fill="url(#silver)"/>

    <!-- 하단 틸 면 -->
    <path d="M155 320 Q155 340 175 340 L220 340 L220 260 L180 260 L180 220 L260 220 L260 280 L300 240 L300 390 L160 390 Q120 390 120 350 L120 310 Z" fill="url(#teal)" opacity="0.85"/>

    <!-- 오른쪽 다크틸 면 -->
    <path d="M300 140 L300 390 L260 390 L260 220 L300 180 Z" fill="url(#darkTeal)"/>
    <path d="M300 140 L340 100 L340 350 L300 390 Z" fill="#2a7070"/>

    <!-- 상단 옐로우 V자 -->
    <path d="M120 140 L230 60 L340 140 L280 140 L230 105 L180 140 Z" fill="url(#yellow)"/>
  </g>

  <!-- 지도 핀 (우상단) -->
  <g transform="translate(680, 100)" filter="url(#shadow)">
    <path d="M70 0 C30 0 0 30 0 70 C0 120 70 175 70 175 C70 175 140 120 140 70 C140 30 110 0 70 0 Z" fill="url(#pinColor)" stroke="#c02020" stroke-width="3"/>
    <circle cx="70" cy="65" r="30" fill="#ffffff"/>
    <circle cx="70" cy="65" r="12" fill="#FF5555"/>
    <!-- 하이라이트 -->
    <ellipse cx="55" cy="45" rx="15" ry="10" fill="rgba(255,255,255,0.35)" transform="rotate(-20, 55, 45)"/>
  </g>

  <!-- 하단 텍스트 -->
  <text x="512" y="870" text-anchor="middle" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="8">가맹점 찾기</text>

  <!-- 작은 지도 핀 장식 (좌하단) -->
  <g transform="translate(130, 750)" opacity="0.4">
    <path d="M20 0 C9 0 0 9 0 20 C0 35 20 50 20 50 C20 50 40 35 40 20 C40 9 31 0 20 0 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(200, 780)" opacity="0.25">
    <path d="M15 0 C7 0 0 7 0 15 C0 26 15 38 15 38 C15 38 30 26 30 15 C30 7 23 0 15 0 Z" fill="#ffffff"/>
  </g>
</svg>
